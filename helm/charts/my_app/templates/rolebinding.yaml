apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "my_app.fullname" . }}
  labels:
    {{- include "my_app.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "my_app.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "my_app.fullname" . }}
