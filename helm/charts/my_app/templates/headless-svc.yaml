apiVersion: v1
kind: Service
metadata:
  name: {{ include "my_app.fullname" . }}-headless
  labels:
    {{- include "my_app.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "my_app.selectorLabels" . | nindent 4 }}
